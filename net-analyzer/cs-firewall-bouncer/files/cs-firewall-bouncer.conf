# OpenRC service providing the CrowdSec LAPI used by the firewall bouncer. The
# init script defaults to the local crowdsec service if this setting or this
# file is absent.
lapi_init_service="crowdsec"

# For a remote LAPI, disable the local service dependency and optionally order
# startup after networking and DNS. Also set retry_initial_connect: true in the
# firewall bouncer YAML so temporary network outages do not terminate it.
#lapi_init_service="none"
#rc_after="net dns"

# OpenRC service that restores persistent firewall state before the CrowdSec
# firewall bouncer starts. The init script defaults to nftables if this setting
# or this file is absent.
#
# Set this to the service matching the configured backend, such as iptables or
# pf. Set it to "none" when no separate firewall-state service is used.
firewall_init_service="nftables"
